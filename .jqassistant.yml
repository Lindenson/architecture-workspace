# jQAssistant configuration for scanning into the Neo4j container.
#
# WITHOUT THIS FILE the CLI writes to its own EMBEDDED store: the scan reports
# success and the graph the MCP server reads stays empty. Committed on purpose —
# it is not a personal preference, it is the difference between a working
# install and a silent one.

jqassistant:
  store:
    uri: bolt://localhost:7687
    # Credentials omitted deliberately.
    #
    # jQAssistant 2.9.1 does not reliably pass store credentials — not from this
    # file, not from -Djqassistant.store.password. It sends an empty token and
    # the driver fails with "Unsupported authentication token, scheme 'none' is
    # only allowed when auth is disabled". With auth ON the graph cannot be
    # populated at all, which disables the most precise source this platform has.
    #
    # Hence NEO4J_AUTH=none in docker-compose.yml, on a Neo4j bound to
    # 127.0.0.1 only. Do NOT copy that to anything reachable from a network.

  analyze:
    # `groups` is a SIBLING of `rule`, not a child. Nested under `rule` it is
    # silently ignored, only the `default` group runs, and a correctly parsed
    # rule set executes nothing — the sole symptom being a WARNING that says
    # "No concepts or constraints were executed". There is no -groups CLI flag
    # in 2.9.1 to override it with.
    groups:
      - aip:default
    rule:
      directory: jqassistant/rules
