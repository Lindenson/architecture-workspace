name: Architecture Gate

# Turns the written invariants into checks. Without this, every rule in
# architecture/constraints/ is a wish.
#
# Runs on PRs against this workspace. To use it in a PRODUCT repository, copy
# the `archunit` and `contract-integrity` jobs and point them at that repo's
# modules (see integration/README.md).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build MCP reactor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build and test
        working-directory: mcp-servers
        run: mvn -B -ntp verify

  archunit:
    name: ArchUnit constraints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Run architecture tests
        working-directory: architecture-tests
        run: mvn -B -ntp test
      - name: Publish violations
        if: failure()
        run: |
          echo "::error::ArchUnit violations — an architecture/constraints/ rule is broken."
          echo "Report: architecture-tests/target/surefire-reports/"

  structurizr:
    name: C4 model validity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate workspace.dsl
        run: |
          docker run --rm -v "$PWD/architecture/c4:/usr/local/structurizr" \
            structurizr/cli:latest validate -workspace workspace.dsl

  contract-integrity:
    name: Governance contract integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Required artifacts are present
        run: |
          set -euo pipefail
          required=(
            .claude/CLAUDE.md
            .claude/OPERATING_LOOPS.md
            .claude/ROLE_ARCHITECT_AGENT.md
            .claude/OPERATING_MODEL.md
            .claude/AGENT_RUNTIME.md
            .claude/skills/session-orientation/SKILL.md
            .claude/skills/spec-critic/SKILL.md
            .claude/skills/feature-impact-analysis/SKILL.md
            .claude/skills/decision-capture/SKILL.md
            .claude-plugin/plugin.json
            .mcp.json
          )
          missing=0
          for f in "${required[@]}"; do
            # CLAUDE.md lives at the root, not under .claude/
            [ "$f" = ".claude/CLAUDE.md" ] && f="CLAUDE.md"
            if [ ! -f "$f" ]; then echo "::error::missing $f"; missing=1; fi
          done
          exit $missing

      - name: Every skill has frontmatter with name and description
        run: |
          set -euo pipefail
          fail=0
          for s in .claude/skills/*/SKILL.md .claude/agents/*.md; do
            head -1 "$s" | grep -q '^---$' || { echo "::error::$s: no frontmatter"; fail=1; continue; }
            grep -q '^name:'        "$s" || { echo "::error::$s: no name";        fail=1; }
            grep -q '^description:' "$s" || { echo "::error::$s: no description"; fail=1; }
          done
          exit $fail

      - name: No secrets committed
        run: |
          set -euo pipefail
          if git ls-files | grep -Ev '\.example$' | grep -E '(^|/)(\.env|.*\.config\.yml|.*\.token)$'; then
            echo "::error::a real credential file is tracked in git"
            exit 1
          fi

      - name: README claims match the tree
        run: |
          set -euo pipefail
          fail=0
          # Directories the README advertises must actually exist — this repo is
          # about documentation drift; it does not get an exemption.
          for d in knowledge architecture delivery quality history domain reports \
                   rag project-memory automation config jqassistant mcp-servers \
                   architecture-tests db integration; do
            [ -d "$d" ] || { echo "::error::README advertises $d/ but it does not exist"; fail=1; }
          done
          exit $fail

      - name: Hooks are executable
        run: |
          set -euo pipefail
          fail=0
          for h in .claude/hooks/*.sh; do
            [ -x "$h" ] || { echo "::error::$h is not executable"; fail=1; }
            bash -n "$h" || { echo "::error::$h has a syntax error"; fail=1; }
          done
          exit $fail
