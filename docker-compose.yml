# ============================================================================
#  Architecture Intelligence Platform — local infra & MVP-1 MCP servers
# ----------------------------------------------------------------------------
#  PREREQUISITES (run these first):
#    1. Build the MCP server jars:
#         cd mcp-servers && mvn -DskipTests package
#       (each module produces target/<module>.jar via <finalName>)
#    2. Provide secrets:
#         cp .env.example .env   # then edit .env
#
#  USAGE:
#    docker compose up -d postgres neo4j   # infra only
#    docker compose up -d                  # infra + all MVP-1 MCP servers
#
#  The MCP servers run the prebuilt jars on a stock JRE image (no in-container
#  Maven build) — rebuild + `docker compose restart <svc>` to pick up changes.
#  All secrets come from .env (env_file); none are baked into this file.
# ============================================================================

services:

  # --- PostgreSQL + pgvector: Digital Twin store + RAG vector store ---------
  postgres:
    # Pinned: `pg16` still floats on every patch release.
    image: pgvector/pgvector:${PGVECTOR_IMAGE_TAG:-0.8.0-pg16}
    container_name: aip-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-architecture_ai}
      POSTGRES_USER: ${POSTGRES_USER:-aip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-db-password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Idempotent schema bootstrap — only runs on first init of an empty volume.
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aip} -d ${POSTGRES_DB:-architecture_ai}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Neo4j: jQAssistant architecture graph (MVP-2) ------------------------
  neo4j:
    # Pinned. `5-community` floated to 5.26.29 and stopped starting; an
    # unpinned tag is an unannounced upgrade of something you depend on.
    image: neo4j:${NEO4J_IMAGE_TAG:-5.26.29-community}
    container_name: aip-neo4j
    # max-attempts stops a broken service from restarting silently for days.
    # After the limit it stays down, which is visible in `docker compose ps`.
    restart: on-failure:5
    environment:
      # LOCAL DEVELOPMENT DEFAULT: authentication off.
      #
      # Not laziness — jQAssistant 2.9.1 does not reliably pass store
      # credentials, from .jqassistant.yml or from -D properties: it sends an
      # empty token and the driver rejects it. With auth on, the graph cannot
      # be populated at all, which disables the most precise source this
      # platform has.
      #
      # Safe here because Neo4j publishes to 127.0.0.1 only and the MCP servers
      # reach it over the compose network. Set NEO4J_AUTH=neo4j/<password> for
      # anything reachable from a network — and then expect to scan the graph
      # from inside the network, not with the CLI.
      NEO4J_AUTH: ${NEO4J_AUTH:-none}
      # REQUIRED as of neo4j 5.26.29. The image entrypoint writes
      # `server.directories.logs` into the config, and the server then refuses
      # to start because it no longer declares that setting:
      #
      #     Failed to read config: Unrecognized setting. No declared setting
      #     with name: server.directories.logs
      #
      # The container died one second after start, exit code 1, before anything
      # reached the log — and `restart: unless-stopped` retried it 177 times in
      # two days while nobody noticed. Upstream image bug, not a local one.
      NEO4J_server_config_strict__validation_enabled: "false"
      # Bounded heap: the default sizes itself from host RAM, which on a machine
      # already running eight JVMs is generous to the point of rude.
      NEO4J_server_memory_heap_initial__size: ${NEO4J_HEAP:-512m}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP:-512m}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE:-512m}
    ports:
      # Bound to loopback: with auth off this must not be reachable from the LAN.
      - "127.0.0.1:7474:7474"   # HTTP browser
      - "127.0.0.1:7687:7687"   # Bolt
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # --- jira-mcp: DELIVERY_STATE source -------------------------------------
  jira-mcp:
    image: eclipse-temurin:21-jre
    container_name: aip-jira-mcp
    restart: unless-stopped
    env_file: .env
    working_dir: /app
    environment:
      AIP_CONFIG_DIR: /config
    volumes:
      - ./mcp-servers/jira-mcp/target:/app
      - ./config:/config:ro
    command: ["java", "-jar", "/app/jira-mcp.jar"]
    healthcheck:
      # /actuator/health is deliberately exempt from the internal token
      # (InternalTokenAuthFilter.shouldNotFilter) precisely so this works.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    ports:
      - "${PORT_JIRA_MCP:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy

  # --- github-mcp: CODE_STATE / CHANGESET_STATE source ----------------------
  github-mcp:
    image: eclipse-temurin:21-jre
    container_name: aip-github-mcp
    restart: unless-stopped
    env_file: .env
    working_dir: /app
    environment:
      AIP_CONFIG_DIR: /config
    volumes:
      - ./mcp-servers/github-mcp/target:/app
      - ./config:/config:ro
    command: ["java", "-jar", "/app/github-mcp.jar"]
    healthcheck:
      # /actuator/health is deliberately exempt from the internal token
      # (InternalTokenAuthFilter.shouldNotFilter) precisely so this works.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    ports:
      - "${PORT_GITHUB_MCP:-8082}:8082"
    depends_on:
      postgres:
        condition: service_healthy

  # --- sonar-mcp: QUALITY_STATE / DEBT_STATE source -------------------------
  sonar-mcp:
    image: eclipse-temurin:21-jre
    container_name: aip-sonar-mcp
    restart: unless-stopped
    env_file: .env
    working_dir: /app
    environment:
      AIP_CONFIG_DIR: /config
    volumes:
      - ./mcp-servers/sonar-mcp/target:/app
      - ./config:/config:ro
    command: ["java", "-jar", "/app/sonar-mcp.jar"]
    healthcheck:
      # /actuator/health is deliberately exempt from the internal token
      # (InternalTokenAuthFilter.shouldNotFilter) precisely so this works.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8083/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    ports:
      - "${PORT_SONAR_MCP:-8083}:8083"
    depends_on:
      postgres:
        condition: service_healthy

  # --- jqassistant-mcp: ARCHITECTURE_GRAPH source (MVP-2) -------------------
  jqassistant-mcp:
    image: eclipse-temurin:21-jre
    container_name: aip-jqassistant-mcp
    restart: unless-stopped
    env_file: .env
    working_dir: /app
    environment:
      AIP_CONFIG_DIR: /config
      # Reach Neo4j by service name (overrides the localhost default in .env).
      NEO4J_URI: bolt://neo4j:7687
    volumes:
      - ./mcp-servers/jqassistant-mcp/target:/app
      - ./config:/config:ro
    command: ["java", "-jar", "/app/jqassistant-mcp.jar"]
    healthcheck:
      # /actuator/health is deliberately exempt from the internal token
      # (InternalTokenAuthFilter.shouldNotFilter) precisely so this works.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8085/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    ports:
      - "${PORT_JQASSISTANT_MCP:-8085}:8085"
    depends_on:
      neo4j:
        condition: service_healthy

  # --- structurizr-mcp: ARCHITECTURE_MODEL (C4) source (MVP-2) --------------
  structurizr-mcp:
    image: eclipse-temurin:21-jre
    container_name: aip-structurizr-mcp
    restart: unless-stopped
    env_file: .env
    working_dir: /app
    environment:
      AIP_CONFIG_DIR: /config
      # The C4 DSL lives in the repo; mount it and point the server at it.
      STRUCTURIZR_WORKSPACE_PATH: /architecture/c4/workspace.dsl
    volumes:
      - ./mcp-servers/structurizr-mcp/target:/app
      - ./config:/config:ro
      - ./architecture:/architecture:ro
    command: ["java", "-jar", "/app/structurizr-mcp.jar"]
    healthcheck:
      # /actuator/health is deliberately exempt from the internal token
      # (InternalTokenAuthFilter.shouldNotFilter) precisely so this works.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8084/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    ports:
      - "${PORT_STRUCTURIZR_MCP:-8084}:8084"

  # --- rag-mcp: optional KNOWLEDGE/RAG layer (pgvector) ---------------------
  #  OPTIONAL — only starts with:  docker compose --profile knowledge up -d
  #  Embeddings provider is configurable (local ONNX by default, no API key).
  rag-mcp:
    image: eclipse-temurin:21-jre
    container_name: aip-rag-mcp
    profiles: ["knowledge"]
    restart: unless-stopped
    env_file: .env
    working_dir: /app
    environment:
      AIP_CONFIG_DIR: /config
      RAG_REPO_ROOT: /workspace
      RAG_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-architecture_ai}
    volumes:
      - ./mcp-servers/rag-mcp/target:/app
      - ./config:/config:ro
      - ./:/workspace:ro          # workspace docs to index (read-only)
    command: ["java", "-jar", "/app/rag-mcp.jar"]
    healthcheck:
      # /actuator/health is deliberately exempt from the internal token
      # (InternalTokenAuthFilter.shouldNotFilter) precisely so this works.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8088/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    ports:
      - "${PORT_RAG_MCP:-8088}:8088"
    depends_on:
      postgres:
        condition: service_healthy

  # --- wiki-mcp: optional KNOWLEDGE_DOCUMENTS source (Confluence) -----------
  #  OPTIONAL — only starts with:  docker compose --profile knowledge up -d
  wiki-mcp:
    image: eclipse-temurin:21-jre
    container_name: aip-wiki-mcp
    profiles: ["knowledge"]
    restart: unless-stopped
    env_file: .env
    working_dir: /app
    environment:
      AIP_CONFIG_DIR: /config
    volumes:
      - ./mcp-servers/wiki-mcp/target:/app
      - ./config:/config:ro
    command: ["java", "-jar", "/app/wiki-mcp.jar"]
    healthcheck:
      # /actuator/health is deliberately exempt from the internal token
      # (InternalTokenAuthFilter.shouldNotFilter) precisely so this works.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8086/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    ports:
      - "${PORT_WIKI_MCP:-8086}:8086"

  # --- digital-twin-core: orchestrator → DIGITAL_TWIN_MODEL -----------------
  digital-twin-core:
    image: eclipse-temurin:21-jre
    container_name: aip-digital-twin-core
    restart: unless-stopped
    env_file: .env
    working_dir: /app
    environment:
      AIP_CONFIG_DIR: /config
      # Service-name DNS so the orchestrator fans out to the other containers
      # (overrides the localhost defaults in digital-twin application.yml).
      PORT_JIRA_URL: http://jira-mcp:8081
      PORT_GITHUB_URL: http://github-mcp:8082
      PORT_SONAR_URL: http://sonar-mcp:8083
      PORT_JQA_URL: http://jqassistant-mcp:8085
      PORT_STRUCTURIZR_URL: http://structurizr-mcp:8084
      # Optional knowledge layer (off by default). Set KNOWLEDGE_ENABLED=true in
      # .env AND start the servers with: docker compose --profile knowledge up -d
      KNOWLEDGE_ENABLED: ${KNOWLEDGE_ENABLED:-false}
      PORT_RAG_URL: http://rag-mcp:8088
      PORT_WIKI_URL: http://wiki-mcp:8086
    volumes:
      - ./mcp-servers/digital-twin-core/target:/app
      - ./config:/config:ro
    command: ["java", "-jar", "/app/digital-twin-core.jar"]
    healthcheck:
      # The orchestrator was the ONLY one of nine containers without a
      # healthcheck, so `docker compose ps` showed it Up while it was
      # answering on the wrong port and nothing was watching.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    ports:
      - "${PORT_DIGITAL_TWIN:-8089}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      jira-mcp:
        condition: service_healthy
      github-mcp:
        condition: service_healthy
      sonar-mcp:
        condition: service_healthy
      jqassistant-mcp:
        condition: service_healthy
      structurizr-mcp:
        condition: service_healthy

volumes:
  postgres-data:
  neo4j-data:
